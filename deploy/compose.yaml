name: cupb-geoscience-job-hub

x-release-environment: &release-environment
  APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-dev}
  APP_RELEASE_GIT_SHA: ${APP_RELEASE_GIT_SHA:-unknown}
  APP_RELEASE_IMAGE_SHA: ${APP_RELEASE_IMAGE_SHA:-unknown}
  APP_RELEASE_BUILT_AT: ${APP_RELEASE_BUILT_AT:-unknown}
  JOB_HUB_IMAGE: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-cupb-geoscience-job-hub:latest}
  JOB_HUB_BROWSER_IMAGE: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
  BROWSER_DEPS_IMAGE: ${BROWSER_DEPS_IMAGE:-cupb-geoscience-job-hub-browser:bd61c09-general}
  HEADLESS_SHELL_IMAGE: ${HEADLESS_SHELL_IMAGE:-chromedp/headless-shell:latest}

x-browser-build: &browser-build
  context: ..
  dockerfile: deploy/docker/Dockerfile.browser
  args:
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-cupb-geoscience-job-hub:latest}
    BROWSER_DEPS_IMAGE: ${BROWSER_DEPS_IMAGE:-cupb-geoscience-job-hub-browser:bd61c09-general}

x-browser-healthcheck: &browser-healthcheck
  test:
    - CMD-SHELL
    - python -m job_hub.cli browser-worker-health --service-name "$${BROWSER_WORKER_SERVICE_NAME}" --max-age 14400
  interval: 60s
  timeout: 15s
  retries: 3
  start_period: 900s

services:
  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
    image: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
    env_file:
      - ${JOB_HUB_SECRET_ENV_FILE:-../.env}
    environment:
      <<: *release-environment
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GOVERNMENT_ARTIFACT_MANIFEST_PATH: /app/data/government_artifact_manifest.json
      GOVERNMENT_POSITION_REGISTRY_PATH: /app/data/government_position_registry.json
    command: [gunicorn, --bind, 0.0.0.0:8080, --workers, "2", --threads, "4", job_hub.wsgi:app]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ../data:/app/data:ro
      - ../tests/fixtures/source_validation:/app/tests/fixtures/source_validation:ro
    init: true
    stop_grace_period: 45s
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging: {options: {max-size: "10m", max-file: "3"}}

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
    image: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
    env_file:
      - ${JOB_HUB_SECRET_ENV_FILE:-../.env}
    environment:
      <<: *release-environment
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GOVERNMENT_ARTIFACT_MANIFEST_PATH: /app/data/government_artifact_manifest.json
      GOVERNMENT_POSITION_REGISTRY_PATH: /app/data/government_position_registry.json
    command: [python, -m, job_hub.worker]
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ../data:/app/data:ro
      - ../tests/fixtures/source_validation:/app/tests/fixtures/source_validation:ro
    init: true
    stop_grace_period: 45s
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -m, job_hub.cli, worker-health, --max-age, "900"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 900s
    restart: unless-stopped
    logging: {options: {max-size: "10m", max-file: "3"}}

  headless-shell:
    image: ${HEADLESS_SHELL_IMAGE:-chromedp/headless-shell:latest}
    command: [--no-sandbox, --disable-gpu]
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  cnpc-browser:
    build: *browser-build
    image: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
    depends_on: [headless-shell]
    env_file:
      - ${JOB_HUB_SECRET_ENV_FILE:-../.env}
    environment:
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      BROWSER_WORKER_SERVICE_NAME: cnpc-browser
      BROWSER_CAPTURE_MAX_CONCURRENCY: 1
      CNPC_BROWSER_SOURCE_ID: cnpc-career-browser
      CNPC_BROWSER_INTERVAL_MINUTES: 180
      CNPC_BROWSER_CAPTURE_TIMEOUT_SECONDS: 1800
      CNPC_BROWSER_CDP_URL: http://headless-shell:9222
      CNPC_BROWSER_PYTHON_TARGET: /var/lib/job-hub/python-packages
      BROWSER_START_DELAY_SECONDS: 0
    command: [python, -m, job_hub.cnpc_browser_entrypoint]
    volumes: [job_hub_data:/var/lib/job-hub, ../data:/app/data:ro]
    init: true
    stop_grace_period: 45s
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck: *browser-healthcheck
    logging: {options: {max-size: "10m", max-file: "3"}}

  pipechina-headless-shell:
    profiles: [blocked-source]
    image: ${HEADLESS_SHELL_IMAGE:-chromedp/headless-shell:latest}
    command: [--no-sandbox, --disable-gpu, --disable-dev-shm-usage]
    init: true
    shm_size: 512m
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

  pipechina-browser:
    profiles: [blocked-source]
    build: *browser-build
    image: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
    depends_on: [pipechina-headless-shell]
