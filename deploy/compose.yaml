name: cupb-geoscience-job-hub
x-release-environment: &release-environment
  APP_RELEASE_VERSION: ${APP_RELEASE_VERSION:-dev}
  APP_RELEASE_GIT_SHA: ${APP_RELEASE_GIT_SHA:-unknown}
  APP_RELEASE_IMAGE_SHA: ${APP_RELEASE_IMAGE_SHA:-unknown}
  APP_RELEASE_BUILT_AT: ${APP_RELEASE_BUILT_AT:-unknown}
  # Pass the same immutable references used for Compose interpolation into the
  # application container.  ``release-check`` must inspect the image that is
  # actually running, not a stale value left in the secret-bearing .env file.
  JOB_HUB_IMAGE: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-cupb-geoscience-job-hub:latest}
  JOB_HUB_BROWSER_IMAGE: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
  BROWSER_DEPS_IMAGE: ${BROWSER_DEPS_IMAGE:-cupb-geoscience-job-hub-browser:latest}
  HEADLESS_SHELL_IMAGE: ${HEADLESS_SHELL_IMAGE:-chromedp/headless-shell:latest}

services:
  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
    image: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
    env_file:
      - ../.env
    environment:
      <<: *release-environment
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GOVERNMENT_ARTIFACT_MANIFEST_PATH: /app/data/government_artifact_manifest.json
      GOVERNMENT_POSITION_REGISTRY_PATH: /app/data/government_position_registry.json
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:8080
      - --workers
      - "2"
      - --threads
      - "4"
      - job_hub.wsgi:app
    ports:
      # The public proxy uses the host loopback and forwards through 8080.
      # Direct public exposure should only be used for temporary diagnostics.
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ../data:/app/data:ro
      # The validation ledger references versioned offline parser fixtures.
      # Keep them available after image rebuilds so admin quality reports do
      # not depend on a build cache containing the test tree.
      - ../tests/fixtures/source_validation:/app/tests/fixtures/source_validation:ro
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.app
    image: ${JOB_HUB_IMAGE:-cupb-geoscience-job-hub:latest}
    env_file:
      - ../.env
    environment:
      <<: *release-environment
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GOVERNMENT_ARTIFACT_MANIFEST_PATH: /app/data/government_artifact_manifest.json
      GOVERNMENT_POSITION_REGISTRY_PATH: /app/data/government_position_registry.json
    command:
      - python
      - -m
      - job_hub.worker
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ../data:/app/data:ro
      - ../tests/fixtures/source_validation:/app/tests/fixtures/source_validation:ro
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - job_hub.cli
        - worker-health
        - --max-age
        - "900"
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 900s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  job_hub_data:
