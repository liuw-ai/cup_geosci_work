name: cupb-geoscience-job-hub
x-browser-build: &browser-build
  context: .
  dockerfile: Dockerfile.browser
  args:
    RUNTIME_IMAGE: ${RUNTIME_IMAGE:-cupb-geoscience-job-hub:latest}

services:
  headless-shell:
    image: chromedp/headless-shell:latest
    command:
      - --no-sandbox
      - --disable-gpu
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cnpc-browser:
    build: *browser-build
    image: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
    depends_on:
      - headless-shell
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CNPC_BROWSER_SOURCE_ID: cnpc-career-browser
      CNPC_BROWSER_INTERVAL_MINUTES: 180
      CNPC_BROWSER_CDP_URL: http://headless-shell:9222
      CNPC_BROWSER_PYTHON_TARGET: /var/lib/job-hub/python-packages
    command: ["python", "-m", "job_hub.cnpc_browser_entrypoint"]
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ./data:/app/data:ro
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  cmgb-headless-shell:
    image: chromedp/headless-shell:latest
    command:
      - --no-sandbox
      - --disable-gpu
      # 国聘 SPA 在详情页渲染时会消耗较多共享内存；Docker 默认 64 MB
      # 会导致 renderer 直接崩溃，Playwright 只能看到 Target crashed。
      - --disable-dev-shm-usage
    init: true
    shm_size: "512m"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cmgb-browser:
    build: *browser-build
    image: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
    depends_on:
      - cmgb-headless-shell
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      BROWSER_WORKER_KIND: cmgb
      CMGB_BROWSER_SOURCE_ID: cmgb-iguopin-browser
      CMGB_BROWSER_INTERVAL_MINUTES: 180
      # Keep the long-running CMGB detail scan isolated from CNPC's browser
      # worker. Sharing one CDP context lets either worker close the other's
      # pages and turns a complete scan into a false access failure.
      CMGB_BROWSER_CDP_URL: http://cmgb-headless-shell:9222
      CNPC_BROWSER_PYTHON_TARGET: /var/lib/job-hub/python-packages
    command: ["python", "-m", "job_hub.cnpc_browser_entrypoint"]
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ./data:/app/data:ro
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  cnooc-headless-shell:
    image: chromedp/headless-shell:latest
    command:
      - --no-sandbox
      - --disable-gpu
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cnooc-browser:
    build: *browser-build
    image: ${JOB_HUB_BROWSER_IMAGE:-cupb-geoscience-job-hub-browser:latest}
    depends_on:
      - cnooc-headless-shell
    env_file:
      - .env
    environment:
      APP_DATA_DIR: /var/lib/job-hub
      APP_DATABASE_PATH: /var/lib/job-hub/job_hub.sqlite3
