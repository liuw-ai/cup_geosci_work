      BROWSER_WORKER_KIND: cnooc
      CNOOC_BROWSER_SOURCE_ID: cnooc-career-browser
      CNOOC_BROWSER_INTERVAL_MINUTES: 180
      CNOOC_BROWSER_CDP_URL: http://cnooc-headless-shell:9222
      CNPC_BROWSER_PYTHON_TARGET: /var/lib/job-hub/python-packages
    command: ["python", "-m", "job_hub.cnpc_browser_entrypoint"]
    volumes:
      - job_hub_data:/var/lib/job-hub
      - ./data:/app/data:ro
    init: true
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  sinopec-headless-shell:
    image: chromedp/headless-shell:latest
