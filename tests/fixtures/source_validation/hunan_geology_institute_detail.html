      <h1>湖南省2026年省直事业单位第四次公开招聘工作人员公告</h1>
      <p>来源：湖南省人力资源和社会保障厅、湖南省地质院</p>
      <p>发布时间：2026-09-08</p>
      <p>湖南省地质院所属事业单位面向社会公开招聘工作人员。</p>
      <p>地质矿产技术岗，专业要求：地质学、地质工程、地质资源与地质工程、资源勘查工程、地球物理；学历要求：硕士研究生及以上。</p>
      <p>报名时间：2026年9月9日至2026年9月16日。</p>
